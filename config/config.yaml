# Central configuration for the NHL data pipeline.
# Paths are relative to the repository root unless absolute.

database:
  path: data/nhl.db

raw_cache_dir: data/raw_cache

# Complete historical seasons (training / validation). 2025-26 is the
# validation season against closing lines (docs/market_discovery_plan.md).
seasons:
  - "2023-24"
  - "2024-25"
  - "2025-26"

# The season being played. Kept OUT of `seasons` on purpose: a running
# season must never silently enter a training set.
live:
  season: "2026-27"

# Which NHL game types are stored / backfilled. Schedule sync stores every
# type it sees; box scores are backfilled only for the enabled ones.
season_types:
  preseason: false
  regular: true
  playoffs: false

nhl_api:
  web_base: https://api-web.nhle.com/v1
  stats_base: https://api.nhle.com/stats/rest/en
  # Public, unauthenticated endpoints. Be polite: one request at a time.
  min_interval_s: 0.35
  jitter_s: [0.0, 0.25]
  timeout_s: 30
  max_retries: 4
  backoff_base_s: 2.0

# The Odds API (the-odds-api.com). Key only in .env (ODDS_API_KEY).
# Credits: live event odds = markets returned x regions; historical = 10x
# that. docs/market_discovery_plan.md section 4 and 8.
odds:
  sport: icehockey_nhl
  regions: us
  # Phase 0 candidates (plan section 2). Nothing else is bought.
  markets: [player_shots_on_goal, player_total_saves, player_blocked_shots]
  # Entry snapshot anchor = 10:00 US/Eastern on the game day (16:00 CZ),
  # the same anchor as NBA, fixed before any row is downloaded.
  morning_et: "10:00"
  closing_minutes_before_start: 10
  # A closing watcher that wakes up late still prices a game up to this
  # many minutes before / after puck drop minus the offset.
  closing_window_minutes: 20
  # Stop when the shared account balance falls below these.
  reserve_live: 2000
  reserve_backfill: 15000
  # Historical sample (plan 4.2): whole 2025-26 game days in golden-ratio
  # order until this many games.
  backfill_season: "2025-26"
  backfill_target_games: 330
  # Live season, bought the day after from the historical archive at the
  # same anchors (plan amendment D4; scripts/buy_snapshots.py, cloud daily
  # job). Switched ON by the user's "jed" on 2. 10. 2026 (shots only).
  hist_daily_enabled: true
  # Only these markets are bought for the live season (user, 2. 10.: shots
  # only - saves and blocks have not appeared at Tipsport; there is no team
  # shots market in The Odds API).
  hist_daily_markets: [player_shots_on_goal]
  hist_daily_days: 7        # look-back window: a missed run catches up
  hist_daily_budget: 1000   # max credits per run
  # Live tips (docs/tips_plan.md): one live snapshot of today's games per
  # game, these markets only (~1 credit per game).
  live_markets: [player_shots_on_goal]
  # Tipsport margin m of amendment D1 - interim value until fixed after K1.
  tipsport_margin: 0.0875
