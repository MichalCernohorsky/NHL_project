name: Doplneni historie (zdarma)

# One-off downloads from the free NHL API into the database (no odds, no
# credits): the cloud is the only writer of the database, so backfills run
# here, behind the same lock as the daily job. Manual only.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Co doplnit"
        required: true
        type: choice
        options: [attempts, penalties, officials, pbp]

concurrency:
  group: nhl-db               # never two writers of the database at once
  cancel-in-progress: false

permissions:
  contents: read

env:
  NHL_DB_RELEASE_REPO: MichalCernohorsky/NHL_project-data

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Stazeni databaze
        id: down
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py down --force
      - name: Migrace schematu
        run: python scripts/migrate.py
      - name: Doplneni
        run: python "scripts/backfill_${{ inputs.script }}.py"
      - name: Ulozeni databaze
        if: always() && steps.down.outcome == 'success'
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py up
