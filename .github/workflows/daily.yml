name: Denni beh (data zive sezony)

# Same job as launchd com.nhltool.daily on the Mac (docs/automation.md):
# schedule -> box scores -> TOI -> names -> 60-min counts, only what is new.
# GitHub delays or drops scheduled runs (MLB saw 40 min and a skipped day),
# hence two backup times; the run is idempotent, a second one costs seconds.
on:
  # GitHub starts scheduled runs 3-7 hours late (5.-9. 10. 2026: the first
  # run of the day landed at ~19:00 CZ). The run is idempotent and cheap, so
  # one trigger an hour from 11:30 UTC (not earlier: docs/cloud.md) gives the
  # tips a chance to be there by 18:00 CZ.
  schedule:
    - cron: "30 11 * * *"     # 13:30 CEST / 12:30 CET
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

concurrency:
  group: nhl-db               # never two writers of the database at once
  cancel-in-progress: false

permissions:
  contents: read

env:
  NHL_DB_RELEASE_REPO: MichalCernohorsky/NHL_project-data

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Stazeni databaze
        id: down
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py down --force
      - name: Migrace schematu
        run: python scripts/migrate.py
      - name: Denni beh
        run: python scripts/daily_collect.py
      # Yesterday's morning + closing snapshots from the archive (plan D4).
      # Does nothing while odds.hist_daily_enabled is false.
      - name: Nakup vcerejsich snimku kurzu
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python scripts/buy_snapshots.py
      # Tips (docs/tips_plan.md): one live snapshot of today's games (~1
      # credit a game), then today's tips + settlement of finished days.
      - name: Zivy snimek kurzu pro tipy
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python scripts/collect_odds.py live
      - name: Tipy dne a vyhodnoceni
        run: python scripts/build_tips.py
      # Team markets, stage 2 (docs/team_markets_plan.md, T-5): expectations
      # for today's games, once before puck drop; settlement of finished days.
      - name: Tymove trhy
        run: python scripts/build_team_tips.py
      # Also after a failed daily step (keeps what was downloaded), but never
      # when the download itself failed: there is nothing to upload then.
      - name: Ulozeni databaze
        if: always() && steps.down.outcome == 'success'
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py up
