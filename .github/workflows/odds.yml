name: Kontrola klice The Odds API

# Manual only. Live snapshots every 10 min were dropped on 2. 10.: GitHub
# ran that schedule only every 3-6 hours. Snapshots are bought the day after
# from the archive instead (daily.yml, scripts/buy_snapshots.py, plan D4).
# This job checks the ODDS_API_KEY secret with a free call (no credits).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Kontrola klice (zdarma)
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python scripts/collect_odds.py check
