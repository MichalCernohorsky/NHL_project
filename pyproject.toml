[project]
name = "nhl-tool"
version = "0.1.0"
description = "NHL player props research: SQLite DB, historical backfill, pre-registered market discovery"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
