name: Nakup hlavnich kurzu (modely v2, blok B)

# docs/models_v2_plan.md section 2: moneyline + total goals, one archive
# snapshot per game day, three seasons. MANUAL ONLY and DRY by default: the
# job buys only when the input "confirm" is exactly "jed" - the user's
# go-ahead in the conversation - and the script refuses to start when the
# whole purchase is above the budget.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Napis "jed" pro skutecny nakup; cokoli jineho = suchy beh'
        required: false
        default: ""
      budget:
        description: "Strop kreditu pro cely nakup"
        required: false
        default: "10500"

concurrency:
  group: nhl-db               # never two writers of the database at once
  cancel-in-progress: false

permissions:
  contents: read

env:
  NHL_DB_RELEASE_REPO: MichalCernohorsky/NHL_project-data

jobs:
  mainlines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Stazeni databaze
        id: down
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py down --force
      - name: Migrace schematu
        run: python scripts/migrate.py
      - name: Suchy beh (nic se nekupuje)
        run: python scripts/buy_main_lines.py --budget "${{ inputs.budget }}"
      - name: Nakup
        if: inputs.confirm == 'jed'
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python scripts/buy_main_lines.py --buy --budget "${{ inputs.budget }}"
      - name: Ulozeni databaze
        if: always() && inputs.confirm == 'jed' && steps.down.outcome == 'success'
        env: { NHL_DATA_TOKEN: "${{ secrets.NHL_DATA_TOKEN }}" }
        run: python scripts/db_release.py up
